name: CI
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Análisis estático PHP (sintaxis)
        run: find backend frontend index.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias Node
        working-directory: servicios
        run: npm ci
      - name: Pruebas unitarias (parser SMTP y motor predictivo)
        working-directory: servicios
        run: npm test
